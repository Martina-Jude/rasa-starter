
version: "3.1"

slots:
  monthly_income:
    type: text
    mappings:
      - type: from_llm
  rent:
    type: text
    mappings:
      - type: from_llm
  insurance:
    type: text
    mappings:
      - type: from_llm
  groceries:
    type: text
    mappings:
      - type: from_llm
  edit_budget_field:
    type: categorical
    values:
      - income
      - rent
      - insurance
      - groceries
    mappings:
      - type: from_llm

  edit_budget_amount:
    type: text
    mappings:
      - type: from_llm

  wants_budget_suggestion:
    type: bool
    mappings:
      - type: from_llm

  wants_budget_adjustment:
    type: bool
    mappings:
      - type: from_llm

  priority_category:
    type: categorical
    values:
      - social_activities
      - unexpected_expenses
      - savings
    mappings:
      - type: from_llm

  budget_confirmed:
    type: bool
    mappings:
      - type: from_llm

  total_expenses:
    type: float
    mappings:
      - type: custom

  remaining_budget:
    type: float
    mappings:
      - type: custom

  social_activities:
    type: float
    mappings:
      - type: custom

  unexpected_expenses:
    type: float
    mappings:
      - type: custom

  savings:
    type: float
    mappings:
      - type: custom

  budget_saved:
    type: bool
    mappings:
      - type: custom

  budget_adjustment_request:
    type: text
    mappings:
      - type: from_llm



responses:
  utter_greet:
    - text: >
        Hi! I'm My Piggybank. I'm here to make
        managing your money a little easier.
        I can help you create a monthly budget,
        understand financial concepts, or figure
        out how much you can comfortably spend.
        You don't need to know any complicated
        financial terms, we can go through
        everything step by step.

  utter_ask_help:
    - text: "What would you like help with?"

  utter_show_menu:
    - text: >
        With My Piggybank you can create a monthly
        budget, record new expenses, inspect expenses,
        change your budget, check affordability of
        purchases, set a savings goal, request
        saving tips and ask financial questions.
  utter_piggy_scope:
    - text: >
        I can only help you with financial matters. I can't answer
        general knowledge questions yet.

  utter_incorrect_amount:
    - text: "Incorrect amount format. Please try again!"
    
  utter_ask_monthly_income:
    - text: >
        What is your total monthly income (euros)?
  utter_budget_income_received:
    - text: >
        Got it. Your monthly income is €{monthly_income}.

  utter_ask_rent:
    - text: "How much do you spend on things like rent, insurance, groceries, and other necessities? Let's start with rent."

  utter_budget_rent_received:
    - text: "Got it. Your monthly rent is €{rent}."

  utter_ask_insurance:
    - text: "How much do you spend on insurance each month?"

  utter_budget_insurance_received:
    - text: "Got it. Your monthly insurance costs €{insurance}."
  
  utter_ask_groceries:
    - text: "Approximately how much do you spend on groceries each month?"

  utter_budget_groceries_received:
    - text: "Got it. You spend about €{groceries} on groceries each month."

  utter_ask_edit_budget_field:
    - text: "Which would you like to change: income, rent, insurance, or groceries?"

  utter_ask_edit_budget_amount:
    - text: "What is the new monthly amount for {edit_budget_field}, in euros?"


  utter_budget_summary:
    - text: >
        That means your main monthly expenses are
        €{total_expenses}, leaving you approximately
        €{remaining_budget} for other expenses.

        We could divide some of that between social activities,
        unexpected expenses, and savings.

  utter_ask_wants_budget_suggestion:
    - text: >
        Would you like me to suggest a simple way to divide
        your remaining money?

  utter_budget_suggestion:
    - text: >
        Sure! With €{remaining_budget} left, one option would be
        to set aside €{social_activities} for social activities,
        €{unexpected_expenses} for unexpected expenses,
        and €{savings} for savings.

  utter_ask_wants_budget_adjustment:
    - text: >
        Would you like to adjust these amounts depending on
        what is most important to you?

  utter_ask_priority_category:
    - text: >
        Which category would you like to prioritize:
        savings, social activities, or unexpected expenses?

  utter_unrecognized_category:
    - text: >
        I didn't quite understand. Could you please choose
        between savings, social activities, and
        unexpected expenses?

  utter_budget_adjusted:
    - text: >
        I've adjusted your budget based on your priorities!

        Your updated monthly plan is:
        - Social activities: €{social_activities}
        - Unexpected expenses: €{unexpected_expenses}
        - Savings: €{savings}

  utter_ask_budget_confirmed:
    - text: >
        Can you confirm that everything looks right?

  utter_budget_revision:
    - text: >
        I understand! Let's adjust the budget so that it
        works better for you.

  utter_budget_saved:
    - text: >
        Perfect! You have your monthly budget plan now.
        You can come back and change it anytime.

  utter_ask_budget_adjustment_request:
    - text: >
        Would you like to keep this split or change it?
        You can say “more for savings”, give exact amounts,
        or ask me to suggest a change.


actions:
  - action_calculate_budget
  - action_suggest_budget
  - action_adjust_budget
  - action_save_budget
  - action_apply_budget_edit
