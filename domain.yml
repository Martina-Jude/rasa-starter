
version: "3.1"

responses:
  utter_greet:
    - text: >
        Hi! I'm My Piggybank. I'm here to make
        managing your money a little easier.
        I can help you create a monthly budget,
        understand financial concepts, or figure
        out how much you can comfortably spend.
        You don't need to know any complicated
        financial terms, we can go through
        everything step by step.

  utter_ask_help:
    - text: "What would you like help with?"

  utter_show_menu:
    - text: >
        With My Piggybank you can create a monthly
        budget, record new expenses, inspect expenses,
        change your budget, check affordability of
        purchases, set a savings goal, request
        saving tips and ask financial questions.
