
flows:
  greet_user:
    description: >
      Greet the user and introduce MyPiggybank.
      Start when the user says hello, hi, hey,
      or good morning.
    steps:
      - action: utter_greet

  show_menu:
    description: >
      Show the user the available MyPiggybank
      features when they ask for the menu,
      options, or what the chatbot can do.
    steps:
      - action: utter_show_menu
      - action: utter_ask_help
